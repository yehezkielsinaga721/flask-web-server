services:
  flask-app:
    build: .
    image: flask-web-server:v2
    container_name: flask-app
    env_file:
      - .env
    expose:
      - "5000"
    networks:
      - app-network
    restart: unless-stopped

  nginx-proxy:
    image: nginx:1.27-alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - flask-app
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
